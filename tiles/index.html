<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Best Home · Menu</title>
<meta name="description" content="The Best Home menu — food, coffee and drinks.">
<meta name="theme-color" content="#f6f7fb">
<link rel="icon" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preload" href="../assets/fonts/jost.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/base.css">
<style>
  body { background: var(--bg-2); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 6px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .brand img { width: 40px; height: 40px; }
  .brand b { font-size: 19px; letter-spacing: .06em; color: var(--navy); font-weight: 400; }
  .brand b strong { font-weight: 700; }
  .hello { margin: 18px 0 16px; }
  .hello h1 { margin: 0; font-size: clamp(28px, 7vw, 40px); line-height: 1.1; letter-spacing: -.02em; font-weight: 600; color: var(--navy-ink); }
  .hello h1 span { color: var(--red); }
  .hello p { margin: 6px 0 0; color: var(--ink-3); }
  .search { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; border-radius: 16px; background: #fff; box-shadow: var(--shadow-sm); border: 1px solid var(--line); transition: border-color .15s, box-shadow .15s; }
  .search:focus-within { border-color: var(--navy); box-shadow: 0 0 0 4px var(--navy-50); }
  .search .ico { color: var(--ink-3); width: 20px; height: 20px; }
  .search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 16px; }
  .search button { color: var(--ink-3); display: none; }
  .search.has button { display: block; }

  h2.lbl { margin: 28px 0 12px; font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  .sig { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 2px 16px 8px; scrollbar-width: none; }
  .sig::-webkit-scrollbar { display: none; }
  .sig-card { flex: none; width: 200px; scroll-snap-align: start; border-radius: 20px; padding: 16px; color: #fff; background: linear-gradient(145deg, var(--navy) 0%, #34489a 100%); position: relative; overflow: hidden; text-align: left; }
  .sig-card:nth-child(3n+2) { background: linear-gradient(145deg, var(--red) 0%, #d8454a 100%); }
  .sig-card:nth-child(3n) { background: linear-gradient(145deg, #1a2757 0%, #2d3f86 100%); }
  .sig-card .ico { width: 64px; height: 64px; position: absolute; right: -8px; bottom: -8px; opacity: .22; }
  .sig-card small { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; opacity: .8; }
  .sig-card h3 { margin: 4px 0 14px; font-size: 18px; font-weight: 500; line-height: 1.2; min-height: 44px; }
  .sig-card b { font-size: 16px; font-weight: 600; }

  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 640px) { .tiles { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 960px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
  .tile { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; padding: 16px; border-radius: 20px; background: #fff; border: 1px solid var(--line); text-decoration: none; box-shadow: var(--shadow-sm); transition: transform .15s, box-shadow .2s; min-height: 132px; }
  .tile:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .tile:active { transform: scale(.98); }
  .tile .ic { width: 50px; height: 50px; border-radius: 15px; display: grid; place-items: center; background: var(--navy-50); color: var(--navy); }
  .tile.drink .ic { background: var(--red-50); color: var(--red); }
  .tile .ic .ico { width: 28px; height: 28px; }
  .tile h3 { margin: 0; font-size: 16.5px; font-weight: 500; line-height: 1.2; color: var(--ink); }
  .tile p { margin: 3px 0 0; font-size: 13px; color: var(--ink-3); }

  /* category view */
  .cat-head { position: sticky; top: 0; z-index: 20; background: rgba(246,247,251,.9); backdrop-filter: blur(14px) saturate(1.5); -webkit-backdrop-filter: blur(14px) saturate(1.5); border-bottom: 1px solid var(--line); }
  .cat-top { display: flex; align-items: center; gap: 8px; padding: 10px 0 4px; }
  .icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 14px; background: #fff; border: 1px solid var(--line); color: var(--ink); flex: none; text-decoration: none; }
  .cat-top h1 { flex: 1; margin: 0; font-size: 21px; font-weight: 600; color: var(--navy-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 10px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs a { flex: none; padding: 8px 14px; border-radius: 999px; font-size: 14.5px; font-weight: 500; color: var(--ink-2); text-decoration: none; white-space: nowrap; }
  .tabs a.on { background: var(--navy); color: #fff; }
  .cards { display: grid; gap: 10px; padding: 16px 0 24px; grid-template-columns: 1fr; }
  @media (min-width: 760px) { .cards { grid-template-columns: 1fr 1fr; } }
  .card { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px; border-radius: 18px; background: #fff; border: 1px solid var(--line); text-align: left; box-shadow: var(--shadow-sm); transition: transform .12s; }
  .card:active { transform: scale(.985); }
  .card .ic { width: 52px; height: 52px; border-radius: 14px; background: var(--bg-2); color: var(--navy); display: grid; place-items: center; flex: none; }
  .card .t { flex: 1; min-width: 0; }
  .card h3 { margin: 0; font-size: 16.5px; font-weight: 500; line-height: 1.25; }
  .card p { margin: 2px 0 0; font-size: 13.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .pr { text-align: right; font-weight: 600; color: var(--navy); white-space: nowrap; }
  .card .pr small { display: block; font-weight: 400; font-size: 11.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
  .sigtag { display: inline-block; margin-left: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); vertical-align: 2px; }
  .next { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 18px; margin-bottom: 90px; border-radius: 18px; background: var(--navy); color: #fff; text-decoration: none; }
  .next small { display: block; opacity: .7; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
  .next b { font-weight: 500; font-size: 18px; }
  .view { animation: in .28s cubic-bezier(.2,.8,.2,1); }
  .view.back { animation-name: inBack; }
  @keyframes in { from { opacity: 0; transform: translateX(18px); } }
  @keyframes inBack { from { opacity: 0; transform: translateX(-18px); } }

  /* bottom sheet */
  .scrim { position: fixed; inset: 0; z-index: 60; background: rgba(22,26,43,.38); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; max-width: 560px; margin: 0 auto; background: #fff; border-radius: 26px 26px 0 0; padding: 10px 20px calc(24px + var(--safe-b)); transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.8,.2,1); box-shadow: 0 -20px 50px -20px rgba(22,26,43,.35); }
  .open .scrim { opacity: 1; pointer-events: auto; }
  .open .sheet { transform: none; }
  .open .demo-pill { opacity: 0; pointer-events: none; }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
  .sheet .hd { display: flex; gap: 14px; align-items: center; }
  .sheet .hd .ic { width: 60px; height: 60px; border-radius: 18px; background: var(--navy-50); color: var(--navy); display: grid; place-items: center; }
  .sheet .hd .ic .ico { width: 32px; height: 32px; }
  .sheet h2 { margin: 0; font-size: 23px; font-weight: 600; line-height: 1.15; color: var(--navy-ink); }
  .sheet .cat { color: var(--ink-3); font-size: 14px; }
  .sheet .desc { margin: 14px 0 0; color: var(--ink-2); }
  .sheet .sig-l { display: inline-flex; margin-top: 12px; padding: 4px 10px; border-radius: 999px; background: var(--red-50); color: var(--red); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .opts { margin: 18px 0 0; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .opt { display: flex; justify-content: space-between; padding: 14px 16px; font-size: 16px; }
  .opt + .opt { border-top: 1px solid var(--line); }
  .opt b { color: var(--navy); font-weight: 600; }
  .sheet .x { position: absolute; top: 14px; right: 14px; width: 38px; height: 38px; border-radius: 50%; background: var(--bg-2); display: grid; place-items: center; color: var(--ink-2); }
  .empty { text-align: center; color: var(--ink-3); padding: 40px 0; }
  footer { text-align: center; color: var(--ink-3); font-size: 13.5px; padding: 32px 0 96px; }
  footer .c { display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: center; margin-bottom: 8px; }
  footer a { text-decoration: none; }
</style>
</head>
<body>
<div id="app"><div class="bh-loading"><div class="bh-spin"></div>Loading menu…</div></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>

<script src="../assets/config.js"></script>
<script src="../assets/icons.js"></script>
<script src="../assets/menu-core.js"></script>
<script>
(async () => {
  const menu = await BH.load();
  const { esc, price, icon } = BH;
  const cats = menu.categories;
  const DRINK_ICONS = ["coffee", "iced", "mocktail", "juice", "soda", "beer", "wine", "spirits"];
  const isDrink = (c) => DRINK_ICONS.includes(c.icon);
  const app = document.getElementById("app");
  let query = "", lastIdx = -1;

  const priceBlock = (d) => d.prices.length > 1
    ? `<small>from</small><span class="tabnum">${price(BH.minPrice(d))}</span>`
    : `<span class="tabnum">${price(d.prices[0].price)}</span>`;
  const sub = (d) => d.description || (d.prices.length > 1 ? d.prices.map((p) => p.label).join(" · ") : d.prices[0].label);

  const card = (d, c) => `<button class="card" data-d="${d.id}"><span class="ic">${icon(c.icon)}</span>` +
    `<span class="t"><h3>${esc(d.name)}${d.tags.includes("signature") ? '<span class="sigtag" title="Signature"></span>' : ""}</h3>` +
    (sub(d) ? `<p>${esc(sub(d))}</p>` : "") + `</span><span class="pr">${priceBlock(d)}</span></button>`;

  const tileHTML = (c) => `<a class="tile${isDrink(c) ? " drink" : ""}" href="#/${c.id}"><span class="ic">${icon(c.icon)}</span>` +
    `<span><h3>${esc(c.name)}</h3><p>${c.items.length} items · from ${price(Math.min(...c.items.map(BH.minPrice)))}</p></span></a>`;

  function home() {
    const sigs = [];
    cats.forEach((c) => c.items.forEach((d) => d.tags.includes("signature") && sigs.push([d, c])));
    app.innerHTML = `<div class="view back"><div class="wrap">
      <div class="topbar"><a class="brand" href="#/"><img src="../assets/logo-mark.png" alt=""><b>BEST<strong>HOME</strong></b></a></div>
      <div class="hello"><h1>What are you<br>craving <span>today?</span></h1><p>Browse our menu — tap a category to start.</p></div>
      <label class="search" id="search"><span class="sr-only">Search</span>${icon("search")}
        <input id="q" type="search" placeholder="Search the menu" autocomplete="off" enterkeyhint="search" value="${esc(query)}">
        <button type="button" id="clr" aria-label="Clear">${icon("close")}</button></label>
      <div id="body"></div>
      <footer><div class="c">${BH.contactHTML()}</div>All prices in US dollars.</footer>
    </div></div>`;
    const body = document.getElementById("body"), q = document.getElementById("q"), sb = document.getElementById("search");
    const draw = () => {
      sb.classList.toggle("has", !!query);
      if (query.trim()) {
        const res = [];
        cats.forEach((c) => c.items.forEach((d) => BH.matches(d, c, query) && res.push(card(d, c))));
        body.innerHTML = `<h2 class="lbl">${res.length} result${res.length === 1 ? "" : "s"}</h2>` +
          (res.length ? `<div class="cards" style="padding-top:0">${res.join("")}</div>` : `<div class="empty">No dishes match “${esc(query)}”.</div>`);
        return;
      }
      body.innerHTML =
        (sigs.length ? `<h2 class="lbl">House signatures</h2><div class="sig">${sigs.map(([d, c]) =>
          `<button class="sig-card" data-d="${d.id}"><small>${esc(c.name)}</small><h3>${esc(d.name)}</h3><b class="tabnum">${price(BH.minPrice(d))}</b>${icon(c.icon)}</button>`).join("")}</div>` : "") +
        `<h2 class="lbl">Food</h2><div class="tiles">${cats.filter((c) => !isDrink(c)).map(tileHTML).join("")}</div>` +
        `<h2 class="lbl">Drinks</h2><div class="tiles">${cats.filter(isDrink).map(tileHTML).join("")}</div>`;
    };
    q.addEventListener("input", () => { query = q.value; draw(); });
    document.getElementById("clr").onclick = () => { query = ""; q.value = ""; draw(); q.focus(); };
    draw();
  }

  function category(i) {
    const c = cats[i], nx = cats[(i + 1) % cats.length];
    app.innerHTML = `<div class="view${i < lastIdx ? " back" : ""}"><header class="cat-head"><div class="wrap">
        <div class="cat-top"><a class="icon-btn" href="#/" aria-label="All categories">${icon("back")}</a><h1>${esc(c.name)}</h1>
        <a class="icon-btn" href="#/" aria-label="Categories">${icon("grid")}</a></div>
        <nav class="tabs" id="tabs">${cats.map((x) => `<a href="#/${x.id}" class="${x === c ? "on" : ""}">${esc(x.name)}</a>`).join("")}</nav>
      </div></header>
      <main class="wrap"><div class="cards">${c.items.map((d) => card(d, c)).join("")}</div>
        <a class="next" href="#/${nx.id}"><span><small>Next</small><b>${esc(nx.name)}</b></span>${icon("chevron")}</a></main></div>`;
    const on = document.querySelector(".tabs .on"), tabs = document.getElementById("tabs");
    tabs.scrollLeft = on.offsetLeft - tabs.clientWidth / 2 + on.clientWidth / 2;
    lastIdx = i;
  }

  function route() {
    const id = location.hash.replace(/^#\/?/, "");
    const i = cats.findIndex((c) => c.id === id);
    closeSheet();
    if (i >= 0) category(i); else { lastIdx = -1; home(); }
    window.scrollTo(0, 0);
  }

  // swipe between categories
  let sx = 0, sy = 0;
  app.addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  app.addEventListener("touchend", (e) => {
    if (lastIdx < 0) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8 && !e.target.closest(".tabs")) {
      const n = (lastIdx + (dx < 0 ? 1 : cats.length - 1)) % cats.length;
      location.hash = "#/" + cats[n].id;
    }
  }, { passive: true });

  // dish sheet
  const root = document.documentElement, sheet = document.getElementById("sheet");
  function openSheet(id) {
    let d, c;
    cats.some((x) => (c = x, d = x.items.find((y) => y.id === id)));
    if (!d) return;
    sheet.innerHTML = `<div class="grab"></div><button class="x" aria-label="Close">${icon("close")}</button>
      <div class="hd"><span class="ic">${icon(c.icon)}</span><div><h2 id="sheet-title">${esc(d.name)}</h2><div class="cat">${esc(c.name)}</div></div></div>
      ${d.tags.includes("signature") ? '<span class="sig-l">House signature</span>' : ""}
      ${d.description ? `<p class="desc">${esc(d.description)}</p>` : ""}
      <div class="opts">${d.prices.map((p) => `<div class="opt"><span>${esc(p.label || "Price")}</span><b class="tabnum">${price(p.price)}</b></div>`).join("")}</div>`;
    root.classList.add("open");
    sheet.querySelector(".x").onclick = closeSheet;
    sheet.querySelector(".x").focus({ preventScroll: true });
  }
  function closeSheet() { root.classList.remove("open"); }
  document.getElementById("scrim").onclick = closeSheet;
  addEventListener("keydown", (e) => e.key === "Escape" && closeSheet());
  let ty = 0;
  sheet.addEventListener("touchstart", (e) => ty = e.touches[0].clientY, { passive: true });
  sheet.addEventListener("touchend", (e) => e.changedTouches[0].clientY - ty > 60 && closeSheet(), { passive: true });
  app.addEventListener("click", (e) => { const b = e.target.closest("[data-d]"); if (b) openSheet(b.dataset.d); });

  addEventListener("hashchange", route);
  route();
  BH.chrome();
})();
</script>
</body>
</html>
