# Static site, no build step. Netlify just serves the folder.
[build]
  publish = "."
  command = ""

# Keep internal files off the public site
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/data/pos-export.xlsx"
  to = "/404.html"
  status = 404
  force = true

# Menu data must always be fresh; fonts & images can be cached
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manage/*"
  [headers.values]
    X-Robots-Tag = "noindex"
