<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Best Home · Menu</title>
<meta name="description" content="The Best Home menu — food, coffee and drinks.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preload" href="../assets/fonts/jost.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/base.css">
<style>
  :root { --bar-h: 118px; }
  .hero { text-align: center; padding: 28px 16px 18px; }
  .hero img { width: 150px; height: auto; margin: 0 auto; }
  .hero p { margin: 10px 0 0; color: var(--ink-3); font-size: 14px; letter-spacing: .14em; text-transform: uppercase; }

  .bar { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.92); backdrop-filter: saturate(1.6) blur(14px); -webkit-backdrop-filter: saturate(1.6) blur(14px); border-bottom: 1px solid transparent; transition: border-color .2s, box-shadow .2s; }
  .bar.stuck { border-color: var(--line); box-shadow: 0 6px 20px -16px rgba(22,26,43,.35); }
  .bar-in { max-width: 1080px; margin: 0 auto; padding: 10px 16px 0; }
  .search { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border-radius: 14px; background: var(--bg-2); border: 1px solid var(--line); transition: border-color .15s, background .15s; }
  .search:focus-within { background: #fff; border-color: var(--navy); }
  .search .ico { color: var(--ink-3); width: 20px; height: 20px; }
  .search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 16px; }
  .search input::placeholder { color: var(--ink-3); }
  .search .clear { display: none; color: var(--ink-3); padding: 4px; border-radius: 50%; }
  .search.has .clear { display: block; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 12px; scrollbar-width: none; scroll-snap-type: x proximity; mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 24px), transparent); -webkit-mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 24px), transparent); padding-left: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 14px 0 11px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--ink-2); font-size: 15px; font-weight: 500; white-space: nowrap; text-decoration: none; scroll-snap-align: start; transition: background .2s, color .2s, border-color .2s; }
  .chip .ico { width: 19px; height: 19px; }
  .chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .searching .chips { opacity: .35; pointer-events: none; }

  main { max-width: 1080px; margin: 0 auto; padding: 8px 16px 80px; }
  section { scroll-margin-top: calc(var(--bar-h) + 8px); padding-top: 26px; }
  .sec-h { display: flex; align-items: center; gap: 12px; margin: 0 0 6px; }
  .badge { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--navy-50); color: var(--navy); }
  .sec-h h2 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -.01em; color: var(--navy-ink); }
  .sec-h small { display: block; color: var(--ink-3); font-size: 13px; font-weight: 400; }
  .list { display: grid; grid-template-columns: 1fr; column-gap: 40px; }
  @media (min-width: 820px) { .list { grid-template-columns: 1fr 1fr; } }
  .dish { display: flex; gap: 16px; align-items: flex-start; padding: 15px 0; border-bottom: 1px solid var(--line); }
  .dish .t { flex: 1; min-width: 0; }
  .dish h3 { margin: 0; font-size: 17px; font-weight: 500; line-height: 1.3; }
  .dish p { margin: 3px 0 0; color: var(--ink-3); font-size: 14px; }
  .dish .pr { font-weight: 600; color: var(--navy); font-size: 16px; white-space: nowrap; }
  .tag { display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; padding: 2px 8px 2px 6px; border-radius: 999px; background: var(--red-50); color: var(--red); font-size: 11.5px; font-weight: 600; letter-spacing: .02em; vertical-align: 2px; text-transform: uppercase; }
  .tag svg { width: 12px; height: 12px; }
  .sizes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .size { display: inline-flex; gap: 6px; align-items: baseline; padding: 5px 10px; border-radius: 10px; background: var(--bg-2); font-size: 13.5px; color: var(--ink-2); }
  .size b { color: var(--navy); font-weight: 600; }
  mark { background: #ffeaa8; color: inherit; border-radius: 3px; padding: 0 1px; }

  .empty { text-align: center; padding: 60px 16px; color: var(--ink-3); }
  .empty button { margin-top: 14px; padding: 10px 18px; border-radius: 999px; background: var(--navy); color: #fff; font-weight: 500; }
  footer { text-align: center; color: var(--ink-3); font-size: 14px; padding: 30px 16px 90px; border-top: 1px solid var(--line); }
  footer img { width: 44px; margin: 0 auto 10px; }
  footer .c { display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: center; margin-bottom: 8px; }
  footer a { text-decoration: none; }
  .top { position: fixed; right: 16px; bottom: calc(16px + var(--safe-b)); z-index: 30; width: 48px; height: 48px; border-radius: 50%; background: #fff; color: var(--navy); box-shadow: var(--shadow); border: 1px solid var(--line); display: grid; place-items: center; opacity: 0; transform: translateY(12px); pointer-events: none; transition: .25s; }
  .top.show { opacity: 1; transform: none; pointer-events: auto; }
</style>
</head>
<body>
<header class="hero">
  <img src="../assets/logo.png" alt="Best Home" width="150" height="92">
  <p>Food · Coffee · Drinks</p>
</header>
<div class="bar" id="bar">
  <div class="bar-in">
    <label class="search" id="search">
      <span class="sr-only">Search the menu</span>
      <span data-i="search"></span>
      <input id="q" type="search" placeholder="Search dishes, drinks…" autocomplete="off" enterkeyhint="search">
      <button class="clear" id="clear" type="button" aria-label="Clear search" data-i="close"></button>
    </label>
    <nav class="chips" id="chips" aria-label="Menu categories"></nav>
  </div>
</div>
<main id="main"><div class="bh-loading"><div class="bh-spin"></div>Loading menu…</div></main>
<footer id="foot"></footer>
<button class="top" id="top" aria-label="Back to top" data-i="up"></button>

<script src="../assets/config.js"></script>
<script src="../assets/icons.js"></script>
<script src="../assets/menu-core.js"></script>
<script>
(async () => {
  const $ = (s) => document.querySelector(s);
  document.querySelectorAll("[data-i]").forEach((el) => el.innerHTML = BH.icon(el.dataset.i));
  BH.chrome();
  const menu = await BH.load();
  const { esc, price } = BH;
  const hl = (s, q) => {
    s = esc(s); if (!q) return s;
    q.trim().split(/\s+/).forEach((w) => { if (w.length > 1) s = s.replace(new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig"), "<mark>$1</mark>"); });
    return s;
  };

  $("#chips").innerHTML = menu.categories.map((c) =>
    `<a class="chip" href="#${c.id}" data-c="${c.id}">${BH.icon(c.icon)}${esc(c.name)}</a>`).join("");

  function dishHTML(d, q) {
    const single = d.prices.length === 1;
    const tags = d.tags.includes("signature") ? `<span class="tag">${BH.icon("star")}Signature</span>` : "";
    const lbl = single && d.prices[0].label ? ` <span style="color:var(--ink-3);font-weight:400">· ${esc(d.prices[0].label)}</span>` : "";
    return `<article class="dish"><div class="t"><h3>${hl(d.name, q)}${lbl}${tags}</h3>` +
      (d.description ? `<p>${hl(d.description, q)}</p>` : "") +
      (single ? "" : `<div class="sizes">${d.prices.map((p) => `<span class="size">${esc(p.label)} <b class="tabnum">${price(p.price)}</b></span>`).join("")}</div>`) +
      `</div>${single ? `<div class="pr tabnum">${price(d.prices[0].price)}</div>` : ""}</article>`;
  }

  function render(q = "") {
    let n = 0;
    const html = menu.categories.map((c) => {
      const items = c.items.filter((d) => BH.matches(d, c, q));
      n += items.length;
      if (!items.length) return "";
      return `<section id="${c.id}" data-c="${c.id}"><div class="sec-h"><span class="badge">${BH.icon(c.icon)}</span>` +
        `<h2>${esc(c.name)}<small>${items.length} item${items.length > 1 ? "s" : ""}</small></h2></div>` +
        `<div class="list">${items.map((d) => dishHTML(d, q)).join("")}</div></section>`;
    }).join("");
    $("#main").innerHTML = n ? html : `<div class="empty">Nothing matches “${esc(q)}”.<br><button id="reset">Show full menu</button></div>`;
    const r = $("#reset"); if (r) r.onclick = () => { $("#q").value = ""; onSearch(); };
    observe();
  }

  // scroll-spy
  let io, lock = 0;
  function setActive(id) {
    document.querySelectorAll(".chip").forEach((ch) => {
      const on = ch.dataset.c === id; ch.classList.toggle("on", on);
      if (on) { const nav = $("#chips"); nav.scrollTo({ left: ch.offsetLeft - nav.clientWidth / 2 + ch.clientWidth / 2, behavior: "smooth" }); }
    });
  }
  function observe() {
    io && io.disconnect();
    const barH = $("#bar").offsetHeight;
    document.documentElement.style.setProperty("--bar-h", barH + "px");
    io = new IntersectionObserver((ents) => {
      if (Date.now() < lock) return;
      const vis = ents.filter((e) => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
      if (vis[0]) setActive(vis[0].target.dataset.c);
    }, { rootMargin: `-${barH + 10}px 0px -65% 0px` });
    document.querySelectorAll("section").forEach((s) => io.observe(s));
  }
  $("#chips").addEventListener("click", (e) => {
    const a = e.target.closest(".chip"); if (!a) return;
    e.preventDefault(); lock = Date.now() + 800; setActive(a.dataset.c);
    document.getElementById(a.dataset.c).scrollIntoView({ behavior: "smooth" });
    history.replaceState(null, "", "#" + a.dataset.c);
  });

  // search
  let t;
  function onSearch() {
    const q = $("#q").value;
    $("#search").classList.toggle("has", !!q);
    document.body.classList.toggle("searching", !!q.trim());
    render(q);
    if (q.trim()) window.scrollTo({ top: $("#bar").offsetTop, behavior: "auto" });
  }
  $("#q").addEventListener("input", () => { clearTimeout(t); t = setTimeout(onSearch, 120); });
  $("#clear").onclick = () => { $("#q").value = ""; onSearch(); $("#q").focus(); };

  // chrome
  const top = $("#top"), bar = $("#bar");
  addEventListener("scroll", () => {
    top.classList.toggle("show", scrollY > 900);
    bar.classList.toggle("stuck", bar.getBoundingClientRect().top <= 0 && scrollY > 10);
  }, { passive: true });
  top.onclick = () => scrollTo({ top: 0, behavior: "smooth" });
  $("#foot").innerHTML = `<img src="../assets/logo-mark.png" alt=""><div class="c">${BH.contactHTML()}</div>All prices in US dollars.`;

  render();
  if (location.hash) { const el = document.getElementById(location.hash.slice(1)); el && el.scrollIntoView(); }
  else setActive(menu.categories[0].id);
})();
</script>
</body>
</html>
